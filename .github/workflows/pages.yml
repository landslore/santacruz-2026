name: Update Futbuteo Data Snapshot for GitHub Pages

on:
  workflow_dispatch:
  schedule:
    # Actualiza el snapshot estático (docs/data.json) cada 6 horas automáticamente
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Actualizar datos de Futbuteo
        run: node scripts/update-data.mjs

      - name: Commit y Push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-refresh Futbuteo league data [skip ci]"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME:-main}" && git push origin "${GITHUB_REF_NAME:-main}" && break || sleep 2
            done
          fi
